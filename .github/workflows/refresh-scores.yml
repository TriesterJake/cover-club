name: Refresh scores

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  refresh-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh-scores endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/cron/refresh-scores"